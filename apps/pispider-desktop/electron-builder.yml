appId: com.pispider.desktop
productName: PiSpider

directories:
  output: release
  buildResources: build

asar: true
asarUnpack:
  - "**/oauth-bridge.mjs"

files:
  - main.cjs
  - preload.cjs
  - mcp-catalog.cjs
  - mcp-tool-runtime.cjs
  - theme-store.cjs
  - slash-helpers.cjs
  - doctor-report.cjs
  - packaged-runtime.cjs
  - oauth-bridge.mjs
  - catalog/**/*
  - renderer/**/*
  - vendor/**/*
  - scripts/**/*

extraResources:
  - from: build/packaged/launcher
    to: launcher
  - from: build/packaged/runtime
    to: runtime
  - from: build/packaged/npm
    to: npm
  # electron-builder skips a top-level node_modules directory in extraResources;
  # copy npm's dependencies from their own root so the CLI can resolve them.
  - from: build/packaged/npm/node_modules
    to: npm/node_modules

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

portable:
  artifactName: "PiSpider Portable ${version}.exe"
